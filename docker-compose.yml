version: "3.8"

# PHASE 1: only Postgres is wired up.
# redis, kafka, zookeeper, and the app service itself will be added in later phases
# (Phase 7, Phase 8, Phase 12 respectively) so we don't spin up infra we aren't using yet.

services:
  postgres:
    image: postgres:16-alpine
    container_name: orderms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: orderuser
      POSTGRES_PASSWORD: orderpass
    ports:
      - "5432:5432"
    volumes:
      - orderms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderuser -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  orderms-postgres-data:
